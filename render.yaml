services:
  - type: web
    name: flutter-nexora
    runtime: node
    rootDir: Nexora/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@nexora.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
